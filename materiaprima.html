<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stokalc</title>
  <style>
    :root {
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --ink: #080808;
      --muted: #4F5358;
      --border: #EAECF0;
      --primary: #59B7EA;
      --primary-ink: #0B6EA8;
      --accent-blue: #A6D9E8;
      --accent-peach: #F09C6A;
      --accent-purple: #996BA1;
      --accent-beige: #D4B6AF;
      --sidebar: #080808;
      --sidebar-muted: #9BA1A6;
      --danger: #DC2626;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(8, 8, 8, .04), 0 12px 32px rgba(8, 8, 8, .06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

    .sidebar {
      background: var(--sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      box-shadow: 0 6px 16px rgba(89, 183, 234, .35);
    }
    .brand-name { font-weight: 700; font-size: 1.02rem; display: flex; flex-direction: column; line-height: 1.15; }
    .brand-name small { font-weight: 500; font-size: .72rem; color: var(--sidebar-muted); }

    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: var(--radius-sm);
      color: #CFD3D8; text-decoration: none; font-size: .92rem; font-weight: 500;
    }
    .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.is-active {
      background: linear-gradient(135deg, rgba(89, 183, 234, .22), rgba(153, 107, 161, .22));
      color: #fff;
    }
    .nav-item:hover:not(.is-active):not(.is-disabled) { background: rgba(255, 255, 255, .06); color: #fff; }
    .nav-item.is-disabled { color: #5C6167; cursor: not-allowed; }

    .sidebar-foot {
      margin-top: auto; font-size: .75rem; color: var(--sidebar-muted);
      display: flex; align-items: center; gap: 8px; padding: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #42D392; box-shadow: 0 0 0 3px rgba(66, 211, 146, .18); }

    .main { padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }

    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .topbar h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.01em; }

    .btn {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: .88rem;
      padding: 10px 18px; border-radius: 12px; color: #fff;
      background: linear-gradient(135deg, var(--primary), #3C9FE0);
      box-shadow: 0 8px 20px rgba(89, 183, 234, .32);
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; filter: none; }
    .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: none; }
    .btn.ghost:hover { border-color: #D3D8E0; filter: none; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .card-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
    }
    .card-head h2 { font-size: 1.05rem; font-weight: 650; }

    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .busca { position: relative; flex: 1 1 240px; min-width: 200px; }
    .busca input {
      width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border);
      border-radius: 10px; font: inherit; font-size: .9rem; background: #FBFCFE;
      transition: border-color .15s, box-shadow .15s;
    }
    .busca input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(89, 183, 234, .18); background: #fff; }
    .busca::before { content: "\1F50D"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .85rem; opacity: .45; pointer-events: none; }
    .contador { color: var(--muted); font-size: .82rem; white-space: nowrap; }

    .colunas { position: relative; }
    .colunas-painel {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: var(--shadow); padding: 10px; min-width: 220px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .colunas-painel[hidden] { display: none; }
    .colunas-painel small { color: var(--muted); font-size: .74rem; padding: 4px 8px 2px; text-transform: uppercase; letter-spacing: .06em; }
    .colunas-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 8px;
      border-radius: 8px; font-size: .88rem; cursor: pointer;
    }
    .colunas-item:hover { background: #F4F7FB; }
    .colunas-item input { accent-color: var(--primary); width: 15px; height: 15px; }

    .tabela-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    thead th {
      color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em;
      font-weight: 600; background: #FBFCFE; vertical-align: top; white-space: nowrap;
    }
    tbody tr:hover { background: #FAFCFE; }
    tbody tr:last-child td { border-bottom: none; }

    .filtro-coluna {
      display: block; width: 100%; margin-top: 7px; padding: 6px 9px;
      border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .78rem;
      font-weight: 400; text-transform: none; letter-spacing: normal; background: #fff;
      min-width: 96px;
    }
    .filtro-coluna:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(89, 183, 234, .18); }

    .vazio { text-align: center; color: var(--muted); padding: 36px 0; }

    .paginacao {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      padding: 14px 20px; border-top: 1px solid var(--border);
    }

    #status {
      position: fixed; top: 18px; right: 18px; padding: 12px 18px; border-radius: 12px;
      color: #fff; font-size: .9rem; box-shadow: var(--shadow); opacity: 0;
      transform: translateY(-10px); transition: opacity .25s, transform .25s;
      pointer-events: none; max-width: 340px;
    }
    #status.visivel { opacity: 1; transform: translateY(0); }
    #status.erro { background: var(--danger); }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static; height: auto; flex-direction: row; align-items: center;
        justify-content: space-between; gap: 12px; padding: 14px 16px;
      }
      .nav { flex-direction: row; }
      .sidebar-foot { display: none; }
      .brand-name small { display: none; }
      .main { padding: 20px 16px 32px; }
    }
    @media (max-width: 520px) {
      .topbar h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Stokalc<small>Perfil Especial</small></span>
      </div>

      <nav class="nav">
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
          Perfis
        </a>
        <span class="nav-item is-disabled">
          <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 3 4-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Saldo
        </span>
        <span class="nav-item is-active">
          <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z" stroke-linejoin="round"/><path d="M3 7l9 5 9-5" stroke-linejoin="round"/><path d="M12 12v10" stroke-linejoin="round"/></svg>
          Matéria-Prima
        </span>
      </nav>

      <div class="sidebar-foot"><span class="dot"></span> API • :9000</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Matéria-Prima</h1>
        </div>
        <button class="btn ghost" id="btnRecarregar" type="button">Recarregar</button>
      </header>

      <section class="card">
        <div class="card-head">
          <h2>Produtos cadastrados</h2>
          <div class="toolbar">
            <div class="busca">
              <input type="search" id="buscaGeral" placeholder="Buscar em todas as colunas..." autocomplete="off" />
            </div>
            <div class="colunas">
              <button class="btn ghost" id="btnColunas" type="button">Colunas</button>
              <div class="colunas-painel" id="colunasPainel" hidden></div>
            </div>
          </div>
        </div>

        <div class="tabela-wrapper">
          <table>
            <thead>
              <tr id="linhaCabecalho"></tr>
            </thead>
            <tbody id="corpoTabela">
              <tr><td colspan="8" class="vazio">Carregando...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="paginacao">
          <button class="btn ghost" id="btnAnterior" type="button">&larr; Anterior</button>
          <span class="contador" id="contador">Carregando...</span>
          <span class="contador" id="paginaInfo">&mdash;</span>
          <button class="btn ghost" id="btnProxima" type="button">Próxima &rarr;</button>
        </div>
      </section>
    </main>
  </div>

  <div id="status"></div>

  <script src="config.js"></script>
  <script>
    const API_BASE = `${window.API_ORIGIN}/materiaprima`;

    const corpoTabela    = document.getElementById('corpoTabela');
    const linhaCabecalho = document.getElementById('linhaCabecalho');
    const statusEl       = document.getElementById('status');
    const buscaGeral     = document.getElementById('buscaGeral');
    const contador       = document.getElementById('contador');
    const paginaInfo     = document.getElementById('paginaInfo');
    const btnAnterior    = document.getElementById('btnAnterior');
    const btnProxima     = document.getElementById('btnProxima');
    const btnColunas     = document.getElementById('btnColunas');
    const colunasPainel  = document.getElementById('colunasPainel');

    const POR_PAGINA = 100;

    const COLUNAS = [
      { campo: 'codinterno',  label: 'Stokalc' },
      { campo: 'nome',        label: 'Descrição' },
      { campo: 'estoque',     label: 'Estoque' },
      { campo: 'estbarra',    label: 'Estoque Barra' },
      { campo: 'localizacao', label: 'Local' },
      { campo: 'cor',         label: 'Cor' },
      { campo: 'perfil',      label: 'Perfil' },
      { campo: 'mercado',     label: 'Mercado' }
    ];

    const colunasOcultas = new Set();
    let filtros = [];

    let todosItens      = [];
    let buscaNormalizada = [];
    let filtrados       = [];
    let pagina          = 0;

    let statusTimer;
    function mostrarErro(mensagem) {
      statusEl.textContent = mensagem;
      statusEl.className = 'visivel erro';
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusEl.className = ''; }, 3500);
    }

    function escapar(valor) {
      if (valor === null || valor === undefined) return '';
      return String(valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizar(valor) {
      return String(valor ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    function valores(item) {
      return {
        codinterno:  item.COD_INTERNO ?? item.cod_interno ?? '',
        nome:        item.NOME_PRO ?? item.nome ?? '',
        estoque:     item.QUANT_ESTOQ ?? item.quant_estoq ?? '',
        estbarra:    item.ESTOQUE_BARRA ?? item.estoque_barra ?? '',
        localizacao: item.LOCALIZACAO ?? item.localizacao ?? '',
        cor:         item.COR ?? item.cor ?? '',
        perfil:      item.PERFIL ?? item.perfil ?? '',
        mercado:     item.CODIGOS_MERCADO ?? item.codigos_mercado ?? ''
      };
    }

    function preparar(registros) {
      todosItens = registros;
      buscaNormalizada = registros.map((item) => {
        const v = valores(item);
        const campos = {};
        Object.keys(v).forEach((campo) => { campos[campo] = normalizar(v[campo]); });
        campos.tudo = Object.values(campos).join(' ');
        return campos;
      });
    }

    function aplicarFiltros() {
      const termoGeral = normalizar(buscaGeral.value);

      const porColuna = {};
      filtros.forEach((f) => { porColuna[f.dataset.campo] = normalizar(f.value); });

      filtrados = [];
      for (let i = 0; i < todosItens.length; i++) {
        const campos = buscaNormalizada[i];
        if (termoGeral && !campos.tudo.includes(termoGeral)) continue;

        let combina = true;
        for (const campo in porColuna) {
          if (porColuna[campo] && !campos[campo].includes(porColuna[campo])) {
            combina = false;
            break;
          }
        }
        if (combina) filtrados.push(i);
      }

      pagina = 0;
      renderizar();
    }

    function renderizar() {
      const total    = filtrados.length;
      const paginas  = Math.max(1, Math.ceil(total / POR_PAGINA));
      if (pagina > paginas - 1) pagina = paginas - 1;
      if (pagina < 0) pagina = 0;

      const inicio = pagina * POR_PAGINA;
      const fatia  = filtrados.slice(inicio, inicio + POR_PAGINA);

      if (!fatia.length) {
        corpoTabela.innerHTML =
          `<tr><td colspan="${COLUNAS.length}" class="vazio">Nenhum item encontrado.</td></tr>`;
      } else {
        corpoTabela.innerHTML = fatia.map((indice) => {
          const v = valores(todosItens[indice]);
          const celulas = COLUNAS.map((c) =>
            `<td data-coluna="${c.campo}">${escapar(v[c.campo])}</td>`).join('');
          return `<tr>${celulas}</tr>`;
        }).join('');
      }

      contador.textContent = `${total} de ${todosItens.length} registro(s)`;
      const de  = total ? inicio + 1 : 0;
      const ate = Math.min(inicio + POR_PAGINA, total);
      paginaInfo.textContent = `${de}-${ate} de ${total}`;
      btnAnterior.disabled = pagina <= 0;
      btnProxima.disabled  = pagina >= paginas - 1;

      aplicarVisibilidade();
    }

    function montarCabecalho() {
      linhaCabecalho.innerHTML = COLUNAS.map((c) =>
        `<th data-coluna="${c.campo}">${escapar(c.label)}` +
        `<input class="filtro-coluna" data-campo="${c.campo}" placeholder="Filtrar" /></th>`
      ).join('');

      filtros = document.querySelectorAll('.filtro-coluna');
      filtros.forEach((f) => f.addEventListener('input', aplicarFiltros));
    }

    function aplicarVisibilidade() {
      document.querySelectorAll('[data-coluna]').forEach((el) => {
        el.style.display = colunasOcultas.has(el.dataset.coluna) ? 'none' : '';
      });
    }

    function carregarColunas() {
      try {
        const salvo = JSON.parse(localStorage.getItem('mp_colunas_ocultas') || '[]');
        if (Array.isArray(salvo)) salvo.forEach((campo) => colunasOcultas.add(campo));
      } catch (e) { }
    }

    function salvarColunas() {
      try {
        localStorage.setItem('mp_colunas_ocultas', JSON.stringify([...colunasOcultas]));
      } catch (e) { }
    }

    function montarPainelColunas() {
      colunasPainel.innerHTML =
        '<small>Colunas visíveis</small>' +
        COLUNAS.map((c) =>
          `<label class="colunas-item">` +
          `<input type="checkbox" data-campo="${c.campo}"${colunasOcultas.has(c.campo) ? '' : ' checked'} />` +
          `${escapar(c.label)}</label>`
        ).join('');

      colunasPainel.querySelectorAll('input[type="checkbox"]').forEach((chk) => {
        chk.addEventListener('change', () => {
          if (chk.checked) colunasOcultas.delete(chk.dataset.campo);
          else colunasOcultas.add(chk.dataset.campo);
          salvarColunas();
          aplicarVisibilidade();
        });
      });
    }

    async function carregarItens() {
      corpoTabela.innerHTML = '<tr><td colspan="8" class="vazio">Carregando...</td></tr>';
      try {
        const resposta = await fetch(API_BASE, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (resposta.status === 404) {
          todosItens = [];
          buscaNormalizada = [];
          aplicarFiltros();
          return;
        }
        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }

        const dados = await resposta.json();
        preparar(Array.isArray(dados) ? dados : [dados]);
        aplicarFiltros();
      } catch (erro) {
        corpoTabela.innerHTML =
          `<tr><td colspan="8" class="vazio">Falha ao carregar: ${escapar(erro.message)}</td></tr>`;
        contador.textContent = '';
        paginaInfo.textContent = '';
        mostrarErro('Não foi possível conectar à API.');
      }
    }

    buscaGeral.addEventListener('input', aplicarFiltros);
    btnAnterior.addEventListener('click', () => {
      if (pagina > 0) { pagina -= 1; renderizar(); }
    });
    btnProxima.addEventListener('click', () => {
      pagina += 1;
      renderizar();
    });
    document.getElementById('btnRecarregar').addEventListener('click', carregarItens);

    btnColunas.addEventListener('click', () => {
      colunasPainel.hidden = !colunasPainel.hidden;
    });
    document.addEventListener('click', (ev) => {
      if (!colunasPainel.hidden && !ev.target.closest('.colunas')) colunasPainel.hidden = true;
    });

    carregarColunas();
    montarCabecalho();
    montarPainelColunas();

    carregarItens();
  </script>
</body>
</html>
