<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil Especial - Listagem</title>
  <style>
    /* ===== Tokens (paleta do shot de referência) ===== */
    :root {
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --ink: #080808;
      --muted: #4F5358;
      --border: #EAECF0;
      --primary: #59B7EA;
      --primary-ink: #0B6EA8;
      --accent-blue: #A6D9E8;
      --accent-peach: #F09C6A;
      --accent-purple: #996BA1;
      --accent-beige: #D4B6AF;
      --sidebar: #080808;
      --sidebar-muted: #9BA1A6;
      --danger: #DC2626;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(8, 8, 8, .04), 0 12px 32px rgba(8, 8, 8, .06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    code {
      font-family: "Cascadia Code", Consolas, ui-monospace, monospace;
      font-size: .85em;
      background: #EEF1F5;
      color: #334;
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* ===== Estrutura ===== */
    .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      background: var(--sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      box-shadow: 0 6px 16px rgba(89, 183, 234, .35);
    }
    .brand-name { font-weight: 700; font-size: 1.02rem; display: flex; flex-direction: column; line-height: 1.15; }
    .brand-name small { font-weight: 500; font-size: .72rem; color: var(--sidebar-muted); }

    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: var(--radius-sm);
      color: #CFD3D8; text-decoration: none; font-size: .92rem; font-weight: 500;
    }
    .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.is-active {
      background: linear-gradient(135deg, rgba(89, 183, 234, .22), rgba(153, 107, 161, .22));
      color: #fff;
    }
    .nav-item:hover:not(.is-active):not(.is-disabled) { background: rgba(255, 255, 255, .06); color: #fff; }
    .nav-item.is-disabled { color: #5C6167; cursor: not-allowed; }

    .sidebar-foot {
      margin-top: auto; font-size: .75rem; color: var(--sidebar-muted);
      display: flex; align-items: center; gap: 8px; padding: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #42D392; box-shadow: 0 0 0 3px rgba(66, 211, 146, .18); }

    /* ===== Main ===== */
    .main { padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }

    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .topbar h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.01em; }

    .btn {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: .88rem;
      padding: 10px 18px; border-radius: 12px; color: #fff;
      background: linear-gradient(135deg, var(--primary), #3C9FE0);
      box-shadow: 0 8px 20px rgba(89, 183, 234, .32);
    }
    .btn:hover { filter: brightness(1.05); }
    .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: none; }
    .btn.ghost:hover { border-color: #D3D8E0; filter: none; }

    /* ===== Card / tabela ===== */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .card-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
    }
    .card-head h2 { font-size: 1.05rem; font-weight: 650; }

    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .busca { position: relative; flex: 1 1 240px; min-width: 200px; }
    .busca input {
      width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border);
      border-radius: 10px; font: inherit; font-size: .9rem; background: #FBFCFE;
      transition: border-color .15s, box-shadow .15s;
    }
    .busca input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(89, 183, 234, .18); background: #fff; }
    .busca::before { content: "\1F50D"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .85rem; opacity: .45; pointer-events: none; }
    .contador { color: var(--muted); font-size: .82rem; white-space: nowrap; }

    .tabela-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 13px 20px; text-align: left; border-bottom: 1px solid var(--border); }
    thead th {
      color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em;
      font-weight: 600; background: #FBFCFE; vertical-align: top;
    }
    tbody tr:hover { background: #FAFCFE; }
    tbody tr:last-child td { border-bottom: none; }

    .filtro-coluna {
      display: block; width: 100%; margin-top: 7px; padding: 6px 9px;
      border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .78rem;
      font-weight: 400; text-transform: none; letter-spacing: normal; background: #fff;
    }
    .filtro-coluna:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(89, 183, 234, .18); }

    .vazio { text-align: center; color: var(--muted); padding: 36px 0; }

    .pill {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: .75rem; font-weight: 600;
      background: rgba(89, 183, 234, .14); color: var(--primary-ink);
    }

    /* Miniatura da figura */
    .figura-cell { display: flex; align-items: center; gap: 10px; }
    .thumb-link { display: inline-flex; }
    .thumb {
      width: 46px; height: 46px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--border); background: #F0F2F5; display: block; flex: none;
      transition: box-shadow .15s;
    }
    .thumb-link:hover .thumb { box-shadow: 0 0 0 2px rgba(89, 183, 234, .4); }

    .link-perfil { color: var(--primary-ink); font-weight: 600; text-decoration: none; }
    .link-perfil:hover { text-decoration: underline; }

    /* ===== Mensagem de status ===== */
    #status {
      position: fixed; top: 18px; right: 18px; padding: 12px 18px; border-radius: 12px;
      color: #fff; font-size: .9rem; box-shadow: var(--shadow); opacity: 0;
      transform: translateY(-10px); transition: opacity .25s, transform .25s;
      pointer-events: none; max-width: 340px;
    }
    #status.visivel { opacity: 1; transform: translateY(0); }
    #status.erro { background: var(--danger); }

    /* ===== Responsividade ===== */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static; height: auto; flex-direction: row; align-items: center;
        justify-content: space-between; gap: 12px; padding: 14px 16px;
      }
      .nav { flex-direction: row; }
      .sidebar-foot { display: none; }
      .brand-name small { display: none; }
      .main { padding: 20px 16px 32px; }
    }
    @media (max-width: 520px) {
      .topbar h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Stokalc<small>Perfil Especial</small></span>
      </div>

      <nav class="nav">
        <a class="nav-item is-active" href="index.html">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
          Perfis
        </a>
        <span class="nav-item is-disabled">
          <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 3 4-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Saldo
        </span>
        <a class="nav-item" href="materiaprima.html">
          <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z" stroke-linejoin="round"/><path d="M3 7l9 5 9-5" stroke-linejoin="round"/><path d="M12 12v10" stroke-linejoin="round"/></svg>
          Matéria-Prima
        </a>
      </nav>

      <div class="sidebar-foot"><span class="dot"></span> API • :9000</div>
    </aside>

    <!-- ===== Conteúdo ===== -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1>Perfil Especial</h1>
        </div>
        <button class="btn ghost" id="btnRecarregar" type="button">Recarregar</button>
      </header>

      <!-- Listagem -->
      <section class="card">
        <div class="card-head">
          <h2>Perfis cadastrados</h2>
          <div class="toolbar">
            <div class="busca">
              <input type="search" id="buscaGeral" placeholder="Buscar em todas as colunas..." autocomplete="off" />
            </div>
            <span class="contador" id="contador">Carregando...</span>
          </div>
        </div>

        <div class="tabela-wrapper">
          <table>
            <thead>
              <tr>
                <th>Perfil<input class="filtro-coluna" data-campo="perfil" placeholder="Filtrar" /></th>
                <th>Descrição<input class="filtro-coluna" data-campo="descricao" placeholder="Filtrar" /></th>
                <th>Códigos Mercado<input class="filtro-coluna" data-campo="mercado" placeholder="Filtrar" /></th>
                <th>Figura<input class="filtro-coluna" data-campo="figura" placeholder="Filtrar" /></th>
              </tr>
            </thead>
            <tbody id="corpoTabela">
              <tr><td colspan="4" class="vazio">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="status"></div>

  <!-- Define window.API_ORIGIN conforme o ambiente -->
  <script src="config.js"></script>
  <script>
    // ===== Configuração =====
    const API_BASE = `${window.API_ORIGIN}/perfil`; // URL base da API Horse

    const corpoTabela = document.getElementById('corpoTabela');
    const statusEl    = document.getElementById('status');
    const buscaGeral  = document.getElementById('buscaGeral');
    const contador    = document.getElementById('contador');
    const filtros     = document.querySelectorAll('.filtro-coluna');

    let todosPerfis = []; // lista completa vinda da API

    // ===== Exibe mensagem temporária de erro =====
    let statusTimer;
    function mostrarErro(mensagem) {
      statusEl.textContent = mensagem;
      statusEl.className = 'visivel erro';
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusEl.className = ''; }, 3500);
    }

    // ===== Escapa HTML para evitar injeção no innerHTML =====
    function escapar(valor) {
      if (valor === null || valor === undefined) return '';
      return String(valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ===== Normaliza texto para busca (sem acentos e minúsculo) =====
    function normalizar(valor) {
      return String(valor ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    // Extrai os valores padronizados de um registro
    function valores(perfil) {
      return {
        perfil: perfil.PERFIL ?? perfil.perfil ?? '',
        descricao: perfil.DESCRICAO ?? perfil.descricao ?? '',
        mercado: perfil.CODIGOS_MERCADO ?? perfil.codigos_mercado ?? '',
        figura: perfil.FIGURA ?? perfil.figura ?? ''
      };
    }

    // ===== Aplica a busca geral e os filtros de cada coluna =====
    function aplicarFiltros() {
      const termoGeral = normalizar(buscaGeral.value);

      // Lê o valor digitado em cada filtro de coluna
      const porColuna = {};
      filtros.forEach((f) => { porColuna[f.dataset.campo] = normalizar(f.value); });

      const filtrados = todosPerfis.filter((perfil) => {
        const v = valores(perfil);

        // Busca geral: precisa aparecer em qualquer coluna
        if (termoGeral) {
          const tudo = `${v.perfil} ${v.descricao} ${v.mercado} ${v.figura}`;
          if (!normalizar(tudo).includes(termoGeral)) return false;
        }

        // Filtros por coluna: todos devem coincidir
        return Object.keys(porColuna).every((campo) =>
          !porColuna[campo] || normalizar(v[campo]).includes(porColuna[campo])
        );
      });

      renderizarTabela(filtrados);
      contador.textContent =
        `${filtrados.length} de ${todosPerfis.length} registro(s)`;
    }

    // ===== Renderiza as linhas da tabela =====
    function renderizarTabela(perfis) {
      if (!perfis.length) {
        corpoTabela.innerHTML =
          '<tr><td colspan="4" class="vazio">Nenhum perfil encontrado.</td></tr>';
        return;
      }

      corpoTabela.innerHTML = perfis.map((perfil) => {
        const v = valores(perfil);
        // A coluna Perfil é um link para a página de saldo do perfil
        const url = `perfil-saldos.html?perfil=${encodeURIComponent(v.perfil)}`;
        // Miniatura: a imagem é servida pela API Horse (rota /figura/:arquivo)
        const temFigura = normalizar(v.figura) !== '';
        const imgUrl = `${window.API_ORIGIN}/figura/${encodeURIComponent(v.figura)}`;
        const figura = temFigura
          ? `<span class="figura-cell">
               <a class="thumb-link" href="${imgUrl}" target="_blank" rel="noopener">
                 <img class="thumb" loading="lazy" src="${imgUrl}"
                      alt="${escapar(v.figura)}" title="${escapar(v.figura)}"
                       onerror="this.style.visibility='hidden'">
               </a>
             </span>`
          : `<span style="color:var(--muted)">—</span>`;
        return `
          <tr>
            <td><a class="link-perfil" href="${url}">${escapar(v.perfil)}</a></td>
            <td>${escapar(v.descricao)}</td>
            <td>${escapar(v.mercado)}</td>
            <td>${figura}</td>
          </tr>`;
      }).join('');
    }

    // ===== GET: lista todos os perfis =====
    async function carregarPerfis() {
      corpoTabela.innerHTML = '<tr><td colspan="4" class="vazio">Carregando...</td></tr>';
      try {
        const resposta = await fetch(API_BASE, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        // O backend Horse responde 404 quando a lista está vazia.
        // Tratamos esse caso como "nenhum registro".
        if (resposta.status === 404) {
          todosPerfis = [];
          aplicarFiltros();
          return;
        }
        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }

        // Converte o corpo da resposta para JSON (array de objetos)
        const dados = await resposta.json();
        todosPerfis = Array.isArray(dados) ? dados : [dados];
        aplicarFiltros();
      } catch (erro) {
        corpoTabela.innerHTML =
          `<tr><td colspan="4" class="vazio">Falha ao carregar: ${escapar(erro.message)}</td></tr>`;
        contador.textContent = '';
        mostrarErro('Não foi possível conectar à API.');
      }
    }

    // ===== Eventos: refiltrar conforme digita =====
    buscaGeral.addEventListener('input', aplicarFiltros);
    filtros.forEach((f) => f.addEventListener('input', aplicarFiltros));
    document.getElementById('btnRecarregar').addEventListener('click', carregarPerfis);

    // ===== Carga inicial =====
    carregarPerfis();
  </script>
</body>
</html>
