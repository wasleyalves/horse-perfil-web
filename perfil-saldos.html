<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saldo do Perfil</title>
  <style>
    /* ===== Tokens (paleta do shot de referência) ===== */
    :root {
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --ink: #080808;
      --muted: #4F5358;
      --border: #EAECF0;
      --primary: #59B7EA;
      --primary-ink: #0B6EA8;
      --accent-blue: #A6D9E8;
      --accent-peach: #F09C6A;
      --accent-purple: #996BA1;
      --accent-beige: #D4B6AF;
      --sidebar: #080808;
      --sidebar-muted: #9BA1A6;
      --danger: #DC2626;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(8, 8, 8, .04), 0 12px 32px rgba(8, 8, 8, .06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    code {
      font-family: "Cascadia Code", Consolas, ui-monospace, monospace;
      font-size: .85em;
      background: #EEF1F5;
      color: #334;
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* ===== Estrutura ===== */
    .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      background: var(--sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      box-shadow: 0 6px 16px rgba(89, 183, 234, .35);
    }
    .brand-name { font-weight: 700; font-size: 1.02rem; display: flex; flex-direction: column; line-height: 1.15; }
    .brand-name small { font-weight: 500; font-size: .72rem; color: var(--sidebar-muted); }

    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: var(--radius-sm);
      color: #CFD3D8; text-decoration: none; font-size: .92rem; font-weight: 500;
    }
    .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-item.is-active {
      background: linear-gradient(135deg, rgba(89, 183, 234, .22), rgba(153, 107, 161, .22));
      color: #fff;
    }
    .nav-item:hover:not(.is-active):not(.is-disabled) { background: rgba(255, 255, 255, .06); color: #fff; }
    .nav-item.is-disabled { color: #5C6167; cursor: not-allowed; }

    .sidebar-foot {
      margin-top: auto; font-size: .75rem; color: var(--sidebar-muted);
      display: flex; align-items: center; gap: 8px; padding: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #42D392; box-shadow: 0 0 0 3px rgba(66, 211, 146, .18); }

    /* ===== Main ===== */
    .main { padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }

    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .topbar h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.01em; }
    .subtitle { color: var(--muted); font-size: .92rem; margin-top: 4px; }

    .btn {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: .88rem;
      padding: 10px 18px; border-radius: 12px; color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--primary), #3C9FE0);
      box-shadow: 0 8px 20px rgba(89, 183, 234, .32);
    }
    .btn:hover { filter: brightness(1.05); }
    .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: none; }
    .btn.ghost:hover { border-color: #D3D8E0; filter: none; }

    /* ===== Cards de resumo ===== */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .stat {
      position: relative; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 18px 20px; box-shadow: var(--shadow);
    }
    .stat-label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat-value { display: block; font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; margin-top: 10px; }
    .stat-accent { position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: linear-gradient(180deg, var(--c, var(--primary)), transparent); }

    /* ===== Card / tabela ===== */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .card-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 18px 20px; border-bottom: 1px solid var(--border);
    }
    .card-head h2 { font-size: 1.05rem; font-weight: 650; }

    .tabela-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 13px 20px; text-align: left; border-bottom: 1px solid var(--border); }
    thead th {
      color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em;
      font-weight: 600; background: #FBFCFE; vertical-align: top;
    }
    tbody tr:hover { background: #FAFCFE; }

    .filtro-coluna {
      display: block; width: 100%; margin-top: 7px; padding: 6px 9px;
      border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .78rem;
      font-weight: 400; text-transform: none; letter-spacing: normal; background: #fff;
    }
    .filtro-coluna:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(89, 183, 234, .18); }

    .vazio { text-align: center; color: var(--muted); padding: 36px 0; }

    .swatch { display: inline-flex; align-items: center; gap: 8px; }
    .swatch i {
      width: 12px; height: 12px; border-radius: 4px; display: inline-block;
      background: var(--sw, #CBD2D9); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
    }

    tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; background: #FBFCFE; }
    td.numero, th.numero { text-align: right; font-variant-numeric: tabular-nums; }

    /* ===== Mensagem de status ===== */
    #status {
      position: fixed; top: 18px; right: 18px; padding: 12px 18px; border-radius: 12px;
      color: #fff; font-size: .9rem; box-shadow: var(--shadow); opacity: 0;
      transform: translateY(-10px); transition: opacity .25s, transform .25s;
      pointer-events: none; max-width: 340px;
    }
    #status.visivel { opacity: 1; transform: translateY(0); }
    #status.erro { background: var(--danger); }

    /* ===== Responsividade ===== */
    @media (max-width: 980px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static; height: auto; flex-direction: row; align-items: center;
        justify-content: space-between; gap: 12px; padding: 14px 16px;
      }
      .nav { flex-direction: row; }
      .sidebar-foot { display: none; }
      .brand-name small { display: none; }
      .main { padding: 20px 16px 32px; }
    }
    @media (max-width: 520px) {
      .stats { grid-template-columns: 1fr; }
      .topbar h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Stokalc<small>Comanda Eletrônica</small></span>
      </div>

      <nav class="nav">
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
          Perfis
        </a>
        <span class="nav-item is-active">
          <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 3 4-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Saldo
        </span>
      </nav>

      <div class="sidebar-foot"><span class="dot"></span> API Horse • :9000</div>
    </aside>

    <!-- ===== Conteúdo ===== -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1>Saldo do Perfil: <span id="nomePerfil">&mdash;</span></h1>
          <p class="subtitle">Origem: <code id="urlApi">&mdash;</code></p>
        </div>
        <a class="btn ghost" href="index.html">&larr; Voltar para a lista</a>
      </header>

      <!-- Resumos: quantidade por cor -->
      <section class="stats" id="cardsCores"></section>

      <!-- Listagem do saldo (GET /perfil_list/:perfil) -->
      <section class="card">
        <div class="card-head">
          <h2>Saldo</h2>
        </div>

        <div class="tabela-wrapper">
          <table>
            <thead>
              <tr>
                <th>Código<input class="filtro-coluna" data-campo="codigo" placeholder="Filtrar" /></th>
                <th>Perfil<input class="filtro-coluna" data-campo="perfil" placeholder="Filtrar" /></th>
                <th>Descrição<input class="filtro-coluna" data-campo="descricao" placeholder="Filtrar" /></th>
                <th>Cor<input class="filtro-coluna" data-campo="cor" placeholder="Filtrar" /></th>
                <th>Tamanho<input class="filtro-coluna" data-campo="tamanho" placeholder="Filtrar" /></th>
                <th>Localização<input class="filtro-coluna" data-campo="localizacao" placeholder="Filtrar" /></th>
                <th class="numero">Quantidade<input class="filtro-coluna" data-campo="quantidade" placeholder="Filtrar" /></th>
              </tr>
            </thead>
            <tbody id="corpoTabela">
              <tr><td colspan="7" class="vazio">Carregando...</td></tr>
            </tbody>
            <tfoot id="rodape"></tfoot>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="status"></div>

  <!-- Define window.API_ORIGIN conforme o ambiente -->
  <script src="config.js"></script>
  <script>
    // ===== Configuração =====
    const API_BASE = `${window.API_ORIGIN}/perfil_list`; // endpoint de saldo do perfil

    // Lê o parâmetro "perfil" da URL (ex.: perfil-saldos.html?perfil=SU100)
    const parametros = new URLSearchParams(window.location.search);
    const perfil = (parametros.get('perfil') || '').trim();

    const corpoTabela = document.getElementById('corpoTabela');
    const rodape      = document.getElementById('rodape');
    const statusEl    = document.getElementById('status');
    const nomePerfil  = document.getElementById('nomePerfil');
    const urlApi      = document.getElementById('urlApi');

    const cardsCores = document.getElementById('cardsCores');
    const filtros     = document.querySelectorAll('.filtro-coluna');

    let todosRegistros = []; // lista completa vinda da API

    // ===== Exibe mensagem temporária de erro =====
    let statusTimer;
    function mostrarErro(mensagem) {
      statusEl.textContent = mensagem;
      statusEl.className = 'visivel erro';
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusEl.className = ''; }, 3500);
    }

    // ===== Escapa HTML para evitar injeção no innerHTML =====
    function escapar(valor) {
      if (valor === null || valor === undefined) return '';
      return String(valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ===== Normaliza texto para busca (sem acentos e minúsculo) =====
    function normalizar(valor) {
      return String(valor ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    // Lê um campo do registro aceitando variações de nome/maiúsculas
    function campo(registro, ...nomes) {
      for (const nome of nomes) {
        if (registro[nome] !== undefined && registro[nome] !== null) return registro[nome];
      }
      return '';
    }

    // Formata número no padrão pt-BR
    function formatarNumero(valor) {
      const n = Number(valor);
      return Number.isFinite(n) ? n.toLocaleString('pt-BR') : escapar(valor);
    }

    // Converte nomes de cor comuns em hexadecimal (para o swatch)
    function corParaHex(cor) {
      const mapa = {
        azul: '#59B7EA', 'azul claro': '#A6D9E8', 'azul escuro': '#0B6EA8',
        vermelho: '#E4572E', verde: '#2E9E6B', amarelo: '#F2C14E',
        laranja: '#F09C6A', roxo: '#996BA1', violeta: '#996BA1',
        rosa: '#E58AA8', preto: '#080808', branco: '#FFFFFF',
        cinza: '#9BA1A6', bege: '#D4B6AF', marrom: '#8A5A44',
        dourado: '#C9A227', 'verde claro': '#A8E0B8'
      };
      const chave = String(cor ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
      return mapa[chave] || '#CBD2D9';
    }

    // Extrai os valores padronizados de um registro de saldo
    function valoresSaldo(registro) {
      return {
        codigo: campo(registro, 'COD_PERFIL_ESPECIAL', 'cod_perfil_especial'),
        perfil: campo(registro, 'PERFIL', 'perfil'),
        descricao: campo(registro, 'DSC_PERFIL', 'DESCRICAO', 'descricao'),
        cor: campo(registro, 'COR', 'cor'),
        tamanho: campo(registro, 'TAMANHO', 'tamanho'),
        localizacao: campo(registro, 'LOCALIZACAO', 'localizacao'),
        quantidade: campo(registro, 'QUANTIDADE', 'quantidade')
      };
    }

    // ===== Aplica os filtros de cada coluna =====
    function aplicarFiltros() {
      const porColuna = {};
      filtros.forEach((f) => { porColuna[f.dataset.campo] = normalizar(f.value); });

      const filtrados = todosRegistros.filter((registro) => {
        const v = valoresSaldo(registro);
        return Object.keys(porColuna).every((coluna) =>
          !porColuna[coluna] || normalizar(v[coluna]).includes(porColuna[coluna])
        );
      });

      renderizarTabela(filtrados);
    }

    // ===== Renderiza os cards com a quantidade total por cor =====
    function renderizarCardsPorCor(registros) {
      // Agrupa a quantidade por cor (a grafia exibida é a do primeiro registro de cada cor)
      const porCor = new Map();
      registros.forEach((r) => {
        const nome = String(campo(r, 'COR', 'cor')).trim();
        const chave = nome.toLowerCase();
        const qtd = Number(campo(r, 'QUANTIDADE', 'quantidade')) || 0;
        if (!porCor.has(chave)) porCor.set(chave, { nome, total: 0 });
        porCor.get(chave).total += qtd;
      });

      if (!porCor.size) {
        cardsCores.innerHTML = '';
        return;
      }

      cardsCores.innerHTML = [...porCor.values()]
        .sort((a, b) => b.total - a.total)
        .map(({ nome, total }) => {
          const hex = corParaHex(nome);
          const rotulo = escapar(nome) || 'Sem cor';
          return `
        <article class="stat">
          <span class="stat-label"><span class="swatch"><i style="--sw:${hex}"></i>${rotulo}</span></span>
          <strong class="stat-value">${formatarNumero(total)}</strong>
          <span class="stat-accent" style="--c: ${hex}"></span>
        </article>`;
        })
        .join('');
    }

    // ===== Renderiza as linhas da tabela =====
    function renderizarTabela(registros) {
      const total = registros.reduce(
        (soma, r) => soma + (Number(campo(r, 'QUANTIDADE', 'quantidade')) || 0), 0
      );

      // Atualiza os cards com a quantidade por cor
      renderizarCardsPorCor(registros);

      if (!registros.length) {
        corpoTabela.innerHTML =
          '<tr><td colspan="7" class="vazio">Nenhum registro encontrado.</td></tr>';
        rodape.innerHTML = '';
        return;
      }

      corpoTabela.innerHTML = registros.map((r) => {
        const cor = campo(r, 'COR', 'cor');
        return `
        <tr>
          <td>${escapar(campo(r, 'COD_PERFIL_ESPECIAL', 'cod_perfil_especial'))}</td>
          <td>${escapar(campo(r, 'PERFIL', 'perfil'))}</td>
          <td>${escapar(campo(r, 'DSC_PERFIL', 'DESCRICAO', 'descricao'))}</td>
          <td><span class="swatch"><i style="--sw:${corParaHex(cor)}"></i>${escapar(cor) || '—'}</span></td>
          <td>${escapar(campo(r, 'TAMANHO', 'tamanho'))}</td>
          <td>${escapar(campo(r, 'LOCALIZACAO', 'localizacao'))}</td>
          <td class="numero">${formatarNumero(campo(r, 'QUANTIDADE', 'quantidade'))}</td>
        </tr>`;
      }).join('');

      // Linha de total
      rodape.innerHTML = `
        <tr>
          <td colspan="6">Total</td>
          <td class="numero">${formatarNumero(total)}</td>
        </tr>`;
    }

    // ===== GET: busca o saldo do perfil =====
    async function carregarSaldo() {
      if (!perfil) {
        nomePerfil.textContent = '—';
        cardsCores.innerHTML = '';
        corpoTabela.innerHTML =
          '<tr><td colspan="7" class="vazio">Perfil não informado na URL.</td></tr>';
        mostrarErro('Parâmetro "perfil" ausente na URL.');
        return;
      }

      nomePerfil.textContent = perfil;
      urlApi.textContent = `${API_BASE}/${encodeURIComponent(perfil)}`;
      corpoTabela.innerHTML = '<tr><td colspan="7" class="vazio">Carregando...</td></tr>';

      try {
        const resposta = await fetch(`${API_BASE}/${encodeURIComponent(perfil)}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        // Horse responde 404 quando não há registros: tratamos como lista vazia
        if (resposta.status === 404) {
          todosRegistros = [];
          aplicarFiltros();
          return;
        }
        if (!resposta.ok) {
          throw new Error(`Erro HTTP ${resposta.status}`);
        }

        const dados = await resposta.json();
        todosRegistros = Array.isArray(dados) ? dados : [dados];
        aplicarFiltros();
      } catch (erro) {
        cardsCores.innerHTML = '';
        corpoTabela.innerHTML =
          `<tr><td colspan="7" class="vazio">Falha ao carregar: ${escapar(erro.message)}</td></tr>`;
        rodape.innerHTML = '';
        mostrarErro('Não foi possível conectar à API.');
      }
    }

    // ===== Filtros de coluna =====
    filtros.forEach((f) => f.addEventListener('input', aplicarFiltros));

    // ===== Carga inicial =====
    carregarSaldo();
  </script>
</body>
</html>
